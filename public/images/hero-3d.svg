<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="url(#grid)" />
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- 3D Ship -->
  <g transform="translate(400, 250)">
    <!-- Ship body -->
    <path d="M-150,0 L150,0 L120,80 L-120,80 Z" fill="#3B82F6" fill-opacity="0.8" />
    <path d="M-120,80 L120,80 L100,120 L-100,120 Z" fill="#2563EB" fill-opacity="0.8" />
    
    <!-- Ship details -->
    <rect x="-80" y="-20" width="160" height="40" rx="5" fill="#1E40AF" fill-opacity="0.8" />
    <rect x="-60" y="20" width="120" height="20" rx="5" fill="#1E40AF" fill-opacity="0.8" />
    
    <!-- Windows -->
    <circle cx="-80" cy="0" r="5" fill="#93C5FD" />
    <circle cx="-40" cy="0" r="5" fill="#93C5FD" />
    <circle cx="0" cy="0" r="5" fill="#93C5FD" />
    <circle cx="40" cy="0" r="5" fill="#93C5FD" />
    <circle cx="80" cy="0" r="5" fill="#93C5FD" />
    
    <!-- Water -->
    <path d="M-200,120 Q-100,100 0,120 Q100,140 200,120" stroke="#60A5FA" stroke-width="3" fill="none" />
    <path d="M-200,130 Q-100,110 0,130 Q100,150 200,130" stroke="#60A5FA" stroke-width="3" fill="none" />
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="30" fill="#3B82F6" fill-opacity="0.2" />
  <circle cx="700" cy="400" r="40" fill="#3B82F6" fill-opacity="0.2" />
  <circle cx="200" cy="450" r="25" fill="#3B82F6" fill-opacity="0.2" />
</svg> 