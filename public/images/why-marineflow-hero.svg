<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="800" height="600" fill="url(#paint0_linear)" />
  
  <!-- Grid pattern -->
  <path d="M0 50H800M0 150H800M0 250H800M0 350H800M0 450H800M0 550H800" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1" />
  <path d="M50 0V600M150 0V600M250 0V600M350 0V600M450 0V600M550 0V600M650 0V600M750 0V600" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1" />
  
  <!-- Ship silhouette -->
  <path d="M200 400L300 400L350 350L450 350L500 400L600 400L550 450L250 450L200 400Z" fill="#1E40AF" fill-opacity="0.8" />
  <path d="M300 350L350 300L450 300L500 350" fill="#1E40AF" fill-opacity="0.8" />
  <path d="M350 300L400 250L400 350" fill="#1E40AF" fill-opacity="0.8" />
  
  <!-- AI elements -->
  <circle cx="400" cy="200" r="80" fill="url(#paint1_radial)" fill-opacity="0.6" />
  <circle cx="400" cy="200" r="60" fill="url(#paint2_radial)" fill-opacity="0.4" />
  <circle cx="400" cy="200" r="40" fill="url(#paint3_radial)" fill-opacity="0.2" />
  
  <!-- Data points -->
  <circle cx="250" cy="150" r="5" fill="#3B82F6" />
  <circle cx="350" cy="180" r="5" fill="#3B82F6" />
  <circle cx="450" cy="150" r="5" fill="#3B82F6" />
  <circle cx="550" cy="180" r="5" fill="#3B82F6" />
  <circle cx="300" cy="250" r="5" fill="#3B82F6" />
  <circle cx="500" cy="250" r="5" fill="#3B82F6" />
  <circle cx="400" cy="300" r="5" fill="#3B82F6" />
  
  <!-- Connection lines -->
  <path d="M250 150L350 180" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M350 180L450 150" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M450 150L550 180" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M300 250L400 300" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M500 250L400 300" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- AI text -->
  <text x="400" y="200" font-family="Arial" font-size="24" font-weight="bold" fill="#1E40AF" text-anchor="middle">AI</text>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="20" fill="#3B82F6" fill-opacity="0.1" />
  <circle cx="650" cy="100" r="20" fill="#3B82F6" fill-opacity="0.1" />
  <circle cx="150" cy="500" r="20" fill="#3B82F6" fill-opacity="0.1" />
  <circle cx="650" cy="500" r="20" fill="#3B82F6" fill-opacity="0.1" />
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF" />
      <stop offset="1" stop-color="#E0F2FE" />
    </linearGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 200) rotate(90) scale(80)">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="paint2_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 200) rotate(90) scale(60)">
      <stop stop-color="#60A5FA" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="paint3_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 200) rotate(90) scale(40)">
      <stop stop-color="#93C5FD" />
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg> 