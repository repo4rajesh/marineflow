<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="50" viewBox="0 0 260 50">
  <defs>
    <style>
      .logo-primary { fill: #F3F4F6; } /* Light color for text */
      .logo-accent { fill: #60A5FA; } /* Bright blue for .ai */
      .logo-wheel { stroke: #60A5FA; fill: none; } /* Wheel color */
      .logo-tagline { fill: #94A3B8; } /* Subtle gray for tagline */
    </style>
  </defs>
  <!-- Ship Wheel Icon -->
  <g transform="translate(5,5)">
    <!-- Outer circle with thicker stroke -->
    <circle cx="20" cy="20" r="18" class="logo-wheel" stroke-width="2.5"/>
    <!-- Inner circle -->
    <circle cx="20" cy="20" r="12" class="logo-wheel" stroke-width="2"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="1.5" class="logo-accent"/>
    <!-- Spokes with thicker strokes -->
    <g class="logo-wheel" stroke-width="2.5">
      <!-- Vertical spoke -->
      <line x1="20" y1="3" x2="20" y2="37"/>
      <!-- Horizontal spoke -->
      <line x1="3" y1="20" x2="37" y2="20"/>
      <!-- Diagonal spokes -->
      <line x1="7" y1="7" x2="33" y2="33"/>
      <line x1="33" y1="7" x2="7" y2="33"/>
    </g>
  </g>
  
  <!-- Text -->
  <g transform="translate(50,0)">
    <!-- MarineFlow -->
    <text x="0" y="28" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" class="logo-primary" letter-spacing="0.2">MarineFlow</text>
    <!-- .ai -->
    <text x="130" y="28" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" class="logo-accent" letter-spacing="0.2">.ai</text>
    <!-- Tagline -->
    <text x="0" y="42" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" class="logo-tagline" letter-spacing="0.1">AI-Powered Maritime Efficiency</text>
  </g>
</svg> 